<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#243b67">
  <title>漢字読みファンタジー</title>
  <link rel="preconnect" href="https://tt-sensei.github.io">
  <link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
  <link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="badges.css">
</head>
<body>
  <a class="skip-link" href="#main">もんだいへ</a>
  <header class="topbar">
    <button id="home-btn" class="icon-btn" type="button" aria-label="ホームへ">⌂</button>
    <div class="brand"><span>漢字読み</span><strong>ファンタジー</strong></div>
    <div class="top-stats"><span id="level-chip">Lv.1</span><span id="exp-chip">EXP 0</span></div>
    <button id="sound-btn" class="icon-btn" type="button" aria-label="音の設定">🔊</button>
  </header>
  <main id="main">
    <section id="home-screen" class="screen" aria-labelledby="home-title">
      <div class="hero">
        <div><p class="eyebrow">文の中で読んで、冒険しよう</p><h1 id="home-title">漢字読みファンタジー</h1><p>漢字の部分だけを読んで、10問のバトルにちょうせん！</p></div>
        <img src="https://tt-sensei.github.io/navi-character-/assets/web/groups/group-standing.webp" alt="" onerror="this.hidden=true">
      </div>
      <nav class="home-actions" aria-label="学習メニュー">
        <button class="action-card primary" data-action="quick"><b>⚔️ すぐに冒険</b><span>えらんだ学年のつづき</span></button>
        <button class="action-card" data-action="training"><b>🏋️ 特訓</b><span>苦手や自信のない読み</span></button>
        <button class="action-card" data-action="map"><b>🗺️ 読みマップ</b><span>できるようになった読み</span></button>
        <button class="action-card" data-action="collection"><b>📚 図鑑・バッジ</b><span>冒険のきろく</span></button>
        <button class="action-card" data-action="share"><b>📘 先生の範囲</b><span>つくる・読みこむ</span></button>
        <button class="action-card" data-action="character"><b>🧙 主人公</b><span>冒険するキャラをえらぶ</span></button>
      </nav>
      <section id="shared-card" class="shared-card" hidden></section>
      <div class="section-heading"><div><p class="eyebrow">全24ステージ</p><h2>冒険する場所をえらぶ</h2></div><label>学年 <select id="grade-filter" aria-label="学年を選ぶ"></select></label></div>
      <div id="stage-grid" class="stage-grid"></div>
      <section class="overall-progress"><h2>全体のすすみ</h2><div id="grade-progress" class="grade-progress"></div></section>
    </section>
    <section id="battle-screen" class="screen battle-screen" hidden aria-label="読みバトル">
      <div class="battle-hud"><div><span>❤</span><b id="player-hp">5/5</b></div><div><span id="battle-label">1年①</span><b id="question-count">1/10</b></div><div><span>COMBO</span><b id="combo-count">0</b></div></div>
      <div id="battle-field" class="battle-field">
        <aside class="fighter player"><div class="hpbar"><i id="player-hpbar"></i></div><img id="player-img" alt="主人公"></aside>
        <article class="question-card">
          <div class="sentence-wrap"><p id="sentence" class="sentence"></p><p id="prompt" class="prompt"></p></div>
          <button id="tokkun-toggle" class="tokkun-toggle" type="button">☆ 特訓する</button>
          <div id="answer-display" class="answer-display" aria-live="polite"><span>よみを つくろう</span></div>
          <div id="palette" class="kana-palette" aria-label="読み文字パレット"></div>
          <input id="keyboard-answer" class="keyboard-answer" type="text" inputmode="text" autocomplete="off" autocapitalize="off" aria-label="読みを入力" hidden>
          <div class="answer-actions"><button id="backspace-btn" type="button">1文字もどる</button><button id="clear-btn" type="button">全部けす</button><button id="submit-btn" class="submit" type="button">こたえる</button></div>
          <button id="input-mode-btn" class="text-btn" type="button">⌨️ キーボードでこたえる</button><div id="feedback" class="feedback" aria-live="assertive"></div>
        </article>
        <aside class="fighter enemy"><div class="hpbar"><i id="enemy-hpbar"></i></div><img id="enemy-img" alt="モンスター"></aside>
      </div>
    </section>
    <section id="panel-screen" class="screen panel-screen" hidden><div class="panel-head"><button id="panel-back" type="button">← もどる</button><div><p id="panel-kicker" class="eyebrow"></p><h1 id="panel-title"></h1></div></div><div id="panel-content"></div></section>
    <section id="result-screen" class="screen result-screen" hidden><div id="result-card" class="result-card"></div></section>
  </main>
  <dialog id="modal"><form method="dialog"><button class="dialog-close" value="cancel" aria-label="閉じる">×</button><div id="modal-content"></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="kanji-data.js"></script>
  <script src="kanjiExampleData_1.js"></script><script src="kanjiExampleData_2.js"></script><script src="kanjiExampleData_3.js"></script>
  <script src="kanjiExampleData_4.js"></script><script src="kanjiExampleData_5.js"></script><script src="kanjiExampleData_6.js"></script>
  <script src="data-bridge.js"></script><script type="module" src="app.js"></script>
</body>
</html>
